[package]
name = "brew-server"
version = "1.20.0"
edition = "2021"
license = "Apache-2.0"
description = "Multi-Basestation TETRA Brew protocol hub"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
md5 = "0.7"
serde = { version = "1", features = ["derive"] }
bincode = "1"
tokio = { version = "1", features = ["full"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde_json = "1"
tokio-tungstenite = "0.29.0"
# Federation TLS client (https:// discovery, wss:// peer links). Both are
# already in the tree through axum-server's tls-rustls, with this exact
# feature set, so no new crates are pulled in.
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false }
# HMAC-SHA256 for HA heartbeats; already in the tree through rustls.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }

[build-dependencies]
cc = "1"
