listen = "0.0.0.0:9000"
websocket_path = "/brew/"
websocket_subprotocol = "brew"
route_without_affiliations = true
fallback_broadcast_when_no_affiliations = true
allow_multiple_calls_per_group = true
higher_priority_number_wins = true
preempt_cause = 1
# Force-ends a Brew call (station-to-station private/group, or the Brew leg
# of a SIP-bridged call) once it has run this long, the same as a normal
# hangup (CALL_RELEASE/CALL_GROUP_IDLE). 0 disables the limit.
max_call_duration_seconds = 14400
# Ends a call that has carried no media for this long (Brew: no voice frames
# or call control; SIP: no RTP once answered), e.g. when a GROUP_IDLE or BYE
# was lost. Shared by Brew and SIP calls. 0 disables it.
call_inactivity_timeout_seconds = 60

[tls]
enabled = true
cert_path = "/etc/ssl/brew/server.crt"
key_path = "/etc/ssl/brew/server.key"

[auth]
enabled = true
realm = "brew-server"
session_ttl_seconds = 300

[auth.users]
# Brew usernames (Basestation identities) must be numeric, max 7 digits.
"1000001" = "change-me-bs1"
"1000002" = "change-me-bs2"

# Optional: Basestation's outbound Telemetry channel (BTS -> this server).
# Off by default. See https://github.com/ysamouhos/brew-server/wiki/Basestation-Telemetry for details.
[telemetry]
enabled = true
listen = "0.0.0.0:9001"

[telemetry.users]
"100000001" = "change-me-bs1"
"100000002" = "change-me-bs2"

[telemetry.tls]
enabled = true
cert_path = "/etc/ssl/brew/server.crt"
key_path = "/etc/ssl/brew/server.key"

# Optional: Basestation's inbound Control channel (BTS -> this server, commands
# pushed back down the same connection). Off by default. See
# https://github.com/ysamouhos/brew-server/wiki/Basestation-Control for details.
[control]
enabled = true
listen = "0.0.0.0:9002"

[control.users]
"100000001" = "change-me-bs1"
"100000002" = "change-me-bs2"

[control.tls]
enabled = true
cert_path = "/etc/ssl/brew/server.crt"
key_path = "/etc/ssl/brew/server.key"

# Monitoring dashboard. Now on its OWN listener/port, separate from the Brew
# API. Enabled by default. Set [dashboard.users] to require HTTP Basic auth
# (empty = open). `admins` lists which of those usernames may view/edit
# /settings and issue Basestation control commands; every other
# authenticated user can still read the rest of the dashboard, just not those
# (a plain 403). Leave `admins` empty to let every dashboard user do so.
#
# `ui.open = true` flips the dashboard to open/read-only mode: anyone can view
# it without logging in, but it's read-only until an admin signs in with the
# header's Login button (which unlocks Settings and Basestation control).
# With `ui.open = false` (the default) the configured users must log in just
# to view. `ui.open` is independent of users/admins -- those still define who
# the admins are.
# See https://github.com/ysamouhos/brew-server/wiki/Dashboard.
[dashboard]
enabled = true
listen = "0.0.0.0:9003"
realm = "brew-server-dashboard"
# Name of this server: main dashboard heading and the browser tab title of
# every dashboard page.
servername = "Tetra Network Monitor"
# true: serve the classic dashboard at / instead of the redesigned one.
# Both stay reachable under /classic and /ui.
legacy_ui = false
admins = ["admin"]

[dashboard.ui]
open = false

[dashboard.users]
"admin" = "change-me-admin"
"viewer" = "change-me-viewer"

[dashboard.tls]
enabled = true
cert_path = "tls/dashboard-cert.pem"
key_path = "tls/dashboard-key.pem"

# Persistent history: append-only binary log of completed calls and SDS,
# replayed on startup so history survives restarts. Disable by setting
# enabled = false. Retention, applied at start and once an hour: calls and SDS
# older than keep_days, and beyond max_calls / max_sds (newest kept), are
# dropped from the log (0 = no limit). The totals keep counting them
# (<path>.totals). Admins can also clear all calls or all SDS on the dashboard.
[storage]
enabled = true
path = "brew-history.bin"
keep_days = 7
max_calls = 2000
max_sds = 2000

# ---------------------------------------------------------------------------
# SIP / VoIP subsystem. Off by default. When enabled it binds a UDP SIP
# listener that terminates SIP extensions (user/pass registrations) and SIP
# trunks (peer gateways such as Asterisk), and bridges calls to the Brew/TETRA
# side via the voice routes below. See https://github.com/ysamouhos/brew-server/wiki/SIP-VoIP.
[sip]
enabled = false
listen = "0.0.0.0:5060"
# Address advertised to peers in Contact/Via (leave empty to use the socket's
# local address). Set this to your public/reachable IP when behind NAT.
advertised_host = ""
# UDP port range the RTP relay allocates media legs from.
rtp_port_min = 16000
rtp_port_max = 17000
realm = "brew-server"
registration_ttl_seconds = 3600
# Force-ends a SIP call once it has run this long: a BYE to the SIP peer(s),
# and, for a call bridged to Brew, the matching CALL_RELEASE on that side.
# 0 disables the limit.
max_call_duration_seconds = 14400

# SIP extensions (user/pass). The table key is the AOR user part the phone
# registers as. `issi` optionally maps the extension to a TETRA subscriber so
# voice routes can address it from the Brew side.
[sip.extensions.1001]
password = "change-me-1001"
display_name = "Reception"
issi = 1001
allow_outbound = true

[sip.extensions.1002]
password = "change-me-1002"
display_name = "Dispatch"
allow_outbound = true

# SIP trunks to VoIP gateways. `direction` is one of:
#   outbound - we REGISTER to the peer at `remote_host` (ITSP / Asterisk).
#   inbound  - the peer REGISTERs to us (learn its address from its REGISTER).
#   peer     - static IP-authenticated peer, no registration either way.
[sip.trunks.asterisk]
direction = "outbound"
remote_host = "192.0.2.10:5060"
username = "brew-trunk"
password = "change-me-trunk"
register_interval_seconds = 300
enabled = true

# Voice routes. Evaluated top to bottom; first enabled match wins. `to`/`from`
# endpoints: { kind = "sip_extension", user = "1001" },
#            { kind = "sip_trunk", trunk = "asterisk", number = "..." },
#            { kind = "brew_private", issi = 90 },
#            { kind = "brew_group", gssi = 1001 }.
# `match_pattern` matches the dialled destination: "*" any, trailing "*" prefix,
# otherwise exact. Optional `strip_prefix` removes a leading literal (e.g. an
# outside-line "9") from the dialled string before it reaches an empty-`number`
# sip_trunk destination. A mobile terminal dialling a non-ISSI number (e.g.
# "9" + a 10-digit PSTN number) arrives here too: destination is 0 and the
# digits are the dialled string, matched the same as a SIP extension's dial.

# Extensions, or a mobile terminal, dialling 9 + number go out the Asterisk
# trunk; strip_prefix drops the "9" so the trunk dials 10 digits.
[[sip.routes]]
name = "outbound-via-asterisk"
match_pattern = "9*"
strip_prefix = "9"
to = { kind = "sip_trunk", trunk = "asterisk" }
enabled = true

# Anything arriving from the Asterisk trunk is patched into TETRA group 1001,
# reaching affiliated basestation mobile stations and brew mobile clients.
[[sip.routes]]
name = "asterisk-to-tetra-group"
match_pattern = "*"
from = { kind = "sip_trunk", trunk = "asterisk" }
to = { kind = "brew_group", gssi = 1001 }
enabled = true

# Dial 7 + ISSI from a SIP extension to reach a TETRA subscriber privately.
[[sip.routes]]
name = "ext-to-tetra-private"
match_pattern = "7*"
from = { kind = "sip_extension", user = "1001" }
to = { kind = "brew_private", issi = 90 }
enabled = true

# Federation: connects this brew-server to other brew-server instances over
# the same Brew WebSocket protocol Basestations use (a peer link connects
# and authenticates exactly like a Basestation, just tagged Peer), so calls,
# SDS and subscriber/group registrations can reach a remote site's stations.
# Registrations propagate peer to peer automatically (each server relays
# what it learns to its *other* peers) -- no per-ISSI/GSSI config needed
# here, only which servers to link to. Without loop_safe this is safe for a
# chain or star (any loop-free topology) only. With loop_safe = true on every
# server, rings, full meshes and redundant links are safe too; a server
# without it (older version or loop_safe = false) must still be linked by a
# single link. Enable it on all servers first, then add the redundant links.
# It is negotiated per link (X-Brew-Federation header) on the links we dial
# and the ones we accept, even with enabled = false. The newest registration
# of an ISSI wins network-wide, so keep the servers' clocks on NTP.
[federation]
enabled = false
# loop_safe = true on BOTH servers also relays Basestation positions between them;
# see the Basestation-Locations wiki page.
loop_safe = false
# WebSocket pings on every federation link -- the peers we dial below and
# any peer that dials in to us (this applies even with enabled = false). A
# link that has received nothing, not even a pong, for
# keepalive_timeout_seconds is closed: its registrations are withdrawn and
# an outbound one is redialled, instead of a half-open link silently
# swallowing calls. Any WebSocket peer answers pings, older brew-server
# versions included. The timeout is raised to at least twice the interval;
# keepalive_interval_seconds = 0 turns both off.
keepalive_interval_seconds = 15
keepalive_timeout_seconds = 45

# We dial out to this peer; it needs no matching config for us; an inbound
# connection just authenticates like a Basestation would (with Peer mode),
# so if the peer has [auth] enabled, our username/password below must be in
# its [auth.users].
[[federation.peers]]
name = "site-b"
remote_host = "10.0.0.20:9000"
path = "/brew"
# Only needed if the peer has [auth] enabled -- same numeric-username rule
# as a Basestation's Brew digest identity.
username = "9000001"
password = "change-me-federation"
reconnect_interval_seconds = 15
# Set tls = true when the peer has [tls] enabled (as this file does):
# discovery then goes over https:// and the link over wss://. The peer's
# certificate must chain to a CA in tls_ca_path (default: the
# Debian/Ubuntu/Alpine system bundle; RHEL: /etc/pki/tls/certs/ca-bundle.crt)
# and be valid for tls_server_name (empty = the host part of remote_host).
# For a self-signed peer, point tls_pinned_cert_path at a copy of its
# certificate (the PEM in the peer's [tls] cert_path) instead: exactly that
# certificate is then trusted, whatever its issuer, name or expiry, and
# tls_ca_path/tls_server_name are ignored.
tls = true
tls_ca_path = "/etc/ssl/certs/ca-certificates.crt"
tls_server_name = ""
tls_pinned_cert_path = ""
enabled = true

# APRS: forwards decoded mobile-station LIP positions (the same fixes plotted
# on the dashboard's /map) to APRS-IS. Off by default -- set callsign/passcode
# (this server's own APRS-IS login, not a per-radio credential) before
# enabling. See https://github.com/ysamouhos/brew-server/wiki/APRS.
# SMS Center: store-and-forward for individual SDS. An SDS addressed to an
# ISSI that is not registered on any connected Basestation/peer is saved to a
# JSON file and delivered as soon as that ISSI registers again. Queue visible
# (and deletable by admins) on the dashboard's /sms-center page.
[sms_center]
enabled = true
path = "sms-center.json"
message_ttl_seconds = 604800          # keep undelivered messages 7 days
only_known_destinations = true        # only ISSIs that have registered here before
exclude_protocol_ids = [10]           # never store LIP (0x0A) position reports
max_messages_per_destination = 50
max_messages_total = 5000
send_status_reports = true            # SDS-TL "stored" / "expired" reports to the sender
stored_report_status = 0              # status sent on queueing: 0 = "received" (radio shows
                                      # delivered); 34 (0x22) = ETSI "stored", but most radios show "failed"
delivery_delay_ms = 2000              # wait after registration before delivering
delivery_spacing_ms = 1500            # gap between queued messages to one ISSI
ack_timeout_seconds = 30              # no SDS_REPORT from the BS within this -> retry
retry_interval_seconds = 60
max_attempts = 10                     # 0 = retry until TTL

[aprs]
enabled = false
server = "rotate.aprs2.net:14580"
callsign = ""
passcode = ""
symbol_table = "/"
symbol_code = "j"
comment = "TETRA MS via brew-server"
object_name_prefix = "MS"
min_report_interval_seconds = 60
reconnect_interval_seconds = 15

# Roaming between Basestations. A radio does not deregister from the cell it
# leaves, so the old Basestation keeps listing it until its own timeout.
# kick_old_issi = 1: when a Basestation reports a registration, kick that ISSI
# (control channel) on every other Basestation still holding it, and log it there
# as deregistered "(roamed to other BS)". Needs [telemetry] and [control].
# kick_old_issi = 0 (default): leave the old registration alone.
# kick_delay_ms: hold-off before kicking; if the radio comes back to the old
# Basestation within this time (ping-pong at a cell border) the kick is skipped.
[roaming]
kick_old_issi = 0
kick_delay_ms = 2000

# Announced cell changes between Basestations that offer the handover-v1
# capability: how long the target Basestation has to answer the serving one.
# Keep it below the Basestation's own fallback (FlowStation: 3 s).
[handover]
timeout_ms = 2000

# ISSIs barred from communicating through this server. A listed ISSI still registers
# (so dispatch can reach it) but cannot transmit to groups, make or receive private
# calls, or send or receive SDS. Dispatch ambience listening (SS-AL) to it and LIP
# position traffic still work. Editable live under Settings (no restart). See the
# ISSI-Blacklist wiki page.
[blacklist]
issis = []
# Brew usernames (as in [auth.users]) of Tetra Dispatch consoles allowed to block and
# unblock ISSIs from their own UI. Empty = consoles can see the list but not edit it.
console_users = []

# The closed-network counterpart of the blacklist: with enabled = true only the ISSIs
# listed may communicate through this server; any other radio is barred the same way a
# blacklisted one is (SS-AL, LIP positions and emergency calls still pass, and it can
# still register). Checked here for the whole network, whichever Basestation the radio
# registers on. enabled = false (default): the list is kept but not enforced, so it can
# be built up before the network is closed. Editable live under Settings (no restart).
# kick_unknown = true also kicks an unlisted radio off the Basestation it registers on
# (KickMs over the control channel, after kick_delay_ms; needs [telemetry] and
# [control]). See docs/ISSI-Allowlist.md.
[allowlist]
enabled = false
issis = []
kick_unknown = false
kick_delay_ms = 2000

# Static FALLBACK Basestation locations for the /map dashboard page. A Basestation that
# reports its own latitude/longitude over telemetry (and positions relayed by peer
# servers) take precedence; this only covers Basestations that report none.
# Keyed by the same numeric Brew username the Basestation authenticates with
# above under [auth.users] -- whichever live connection logs in as that
# identity is matched automatically. See https://github.com/ysamouhos/brew-server/wiki/Basestation-Locations.
[bts_locations."1000001"]
name = "Athens HQ"
lat = 37.9917
lon = 23.7640

# Names for ISSIs and groups, shown next to the number on the dashboard.
# Edited on the dashboard's Directory page without a restart.
# [issi_names]
# "2320972" = "OE4SXM Sebastian"
# [gssi_names]
# "2321" = "District North"

# Who may use a group: "allow" = only the listed ISSIs, "block" = everyone
# but them. No entry (or an empty list) = open. rx_only = true makes radios
# listeners (all, or only those in rx_only_issis). Edited on the Directory
# page; Basestations with the group-access extension enforce it on the air.
# [group_access."2321"]
# mode = "allow"
# issis = [2320972, 2321100]
# rx_only = false
# rx_only_issis = []

# Managed talkgroups: a closed set of groups. managed = true lets radios use
# only allowed groups (in allowed, or a group of a talkgroup pool / linked
# talkgroup); affiliations to others are not recorded and their group calls
# dropped (emergency calls pass), and Basestations with group-access refuse
# the attachment on the air. Off (the default) changes nothing and keeps the
# list. Edited on the Routing page. hidden: groups hidden from the Directory
# page (display only).
# Ham callsign database: names radios without a Directory name by their call
# sign from a list of ID;CALLSIGN lines (radioid.net dmrid.dat). Directory
# names always come first. auto = fetch every day at 00:00 UTC. A new list
# replaces the cache file. Set on the dashboard's Directory page.
# [callsign_db]
# enabled = false
# url = "https://radioid.net/static/dmrid.dat"
# auto = false
# cache = "callsign-db.dat"

# [talkgroups]
# managed = false
# allowed = [9, 2321]
# hidden = []

# Talkgroup pools: a call on one group is played 1:1 on the other groups of
# the pool. both_ways = false copies only calls on the first group. A group
# with its own running call is joined when that over ends. Managed on the
# dashboard's Routing page without a restart. See docs/Routing.md.
# [[talkgroup_pools]]
# name = "Region East"
# enabled = true
# both_ways = true
# groups = [2321, 2323, 2324, 2329, 264]

# See https://github.com/ysamouhos/brew-server/wiki/High-Availability.
# Active/standby high availability: two brew-servers on the same LAN / Layer 2
# segment (or the same host, each with its own real IP) share one virtual IP.
# Basestations, terminals and federation peers connect to the VIP; when the
# Active node fails, the Standby takes the VIP over (ip addr + gratuitous ARP)
# and they simply reconnect. Needs CAP_NET_ADMIN and CAP_NET_RAW, plus the
# `ip` and `arping` (iputils) commands. Both nodes use the same vip,
# heartbeat_port and shared_secret; node_name, weight, real_ip and peer_ip
# differ. While HA is enabled, edits to this file are NOT applied
# automatically: apply them from the dashboard's /ha page.
[ha]
enabled = false
node_name = "bs-a"
weight = 200                  # higher weight is the preferred Active node
persist = false               # true: once this node is Active it stays Active,
                              # even when a higher-weight peer comes back
                              # (the dashboard can override this at runtime)
vip = "192.0.2.100/24"
vip_interface = "eth0"
real_ip = "192.0.2.11"        # this node: heartbeat bind + always-on dashboard
peer_ip = "192.0.2.12"        # the other node's real IP
heartbeat_port = 9010         # UDP
heartbeat_interval_ms = 500
dead_after_ms = 2000
shared_secret = "change-me"   # HMAC-SHA256 key for heartbeats
check_gateway = ""            # optional: refuse Active if this IP doesn't answer ping
state_path = "ha-state.json"  # runtime toggles set from the dashboard
